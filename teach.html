    function openLevel(id) {
        selectedLevelId = id;
        const config = levelConfig[id];
        const folderName = config ? config.folder : id;
        const container = document.getElementById('sub-level-container');
        container.innerHTML = '';

        // 設定關卡標題
        if (config && config.name) {
            document.getElementById('level-title').innerText = config.name;
        }

        // 取得 cardset 中該單元的資料
        const folderData = (typeof cardset !== 'undefined' && cardset[folderName]) ? cardset[folderName] : {};

        config.tasks.forEach(task => {
            // 1. 分隔線 (Divider)
            if (task.type === 'divider') {
                const divider = document.createElement('div');
                divider.style.display = 'flex';
                divider.style.alignItems = 'center';
                divider.style.marginTop = '20px';
                divider.style.marginBottom = '12px';
                divider.style.color = 'var(--primary)';
                divider.style.fontSize = '14px';
                divider.style.fontWeight = 'bold';
                divider.style.letterSpacing = '1px';
                divider.innerHTML = `<span>${task.name}</span><div style="flex: 1; height: 1px; background: #334155; margin-left: 15px;"></div>`;
                container.appendChild(divider);
                return;
            }

            // 2. 觀念規則 (Theory) - 規則說明不受題庫影響，一律顯示
            if (task.type === 'theory') {
                const div = document.createElement('div');
                div.className = 'sub-level-item';
                div.innerHTML = `<span style="color:#3b82f6">📘 規則：${task.name}</span><span class="play-icon">▶</span>`;
                div.onclick = () => {
                    window.location.href = `${task.name}.html`;
                };
                container.appendChild(div);
                return;
            }

            // 3. 練習與綜合題庫 (Practice / PracticeLot)
            let taskKey = task.name;
            if (!folderData[taskKey] && task.type === 'practiceLot' && folderData["練習集"]) {
                taskKey = "練習集";
            }

            const taskData = folderData[taskKey];
            let count = 0;
            let hasData = false;

            if (taskData) {
                if (Array.isArray(taskData)) {
                    // 陣列（如 advance 的 練習集）
                    count = taskData.length;
                    hasData = count > 0;
                } else if (typeof taskData === 'object') {
                    // 單一題目物件，確認裡面是否有內容
                    hasData = Object.keys(taskData).length > 0;
                    count = hasData ? 1 : 0;
                }
            } else if (task.type === 'practiceLot') {
                // 綜合題庫：統計該 folder 下所有有內容的練習題總數
                const validKeys = Object.keys(folderData).filter(k => {
                    const item = folderData[k];
                    if (Array.isArray(item)) return item.length > 0;
                    return item && typeof item === 'object' && Object.keys(item).length > 0;
                });
                count = validKeys.length;
                hasData = count > 0;
            }

            // 關鍵修改：若無題目或內容為空 {}，直接隱藏（不產生任何 DOM 元素）
            if (!hasData) {
                return;
            }

            const div = document.createElement('div');
            div.className = 'sub-level-item';

            let prefix = task.type === 'practiceLot' ? "🔥 綜合題庫：" : "📝 練習：";
            let themeColor = task.type === 'practiceLot' ? "#e84c3d" : "#fac400";
            
            let countText = (count > 1 || task.type === 'practiceLot' || Array.isArray(taskData)) 
                ? ` <span style="font-size: 0.85em; opacity: 0.85; margin-left: 6px;">(${count} 題)</span>` 
                : "";

            div.innerHTML = `<span style="color:${themeColor}">${prefix}${task.name}${countText}</span><span class="play-icon">▶</span>`;
            div.onclick = () => {
                goToTask(folderName, taskKey);
            };

            container.appendChild(div);
        });

        document.getElementById('overlay').classList.add('active');
    }
    function goToTask(folder, name) {
        const path = `bidding(teaching).html?folder=${encodeURIComponent(folder)}&name=${encodeURIComponent(name)}`;
        window.location.href = path;
    }

    function closeLevel() {
        document.getElementById('overlay').classList.remove('active');
    }


    function startTraining() {
        if (!selectedLevelId) return alert("請先選擇關卡");
        
        // 假設你的檔名規則是 level-1.json 等
        // 這裡我們直接傳遞檔名給發牌頁面
        const fileName = `${selectedLevelId}.json`; 
        window.location.href = `dealing(random).html?file=${fileName}`;
    }
